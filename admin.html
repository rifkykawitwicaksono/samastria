<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin - TokoSehat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f7fafc;color:#1a202c}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.06)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:18px;border-radius:10px;background:#e8f5ee}.stat b{display:block;font-size:1.7rem}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:600;cursor:pointer}.primary{background:#1a7a4c;color:#fff}.secondary{background:#2b6cb0;color:#fff}.danger{background:#e53e3e;color:#fff}.muted{color:#718096}.hidden{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;vertical-align:top}img.thumb{width:55px;height:45px;object-fit:cover;border-radius:6px}.msg{padding:10px;border-radius:8px;background:#edf2f7;margin-bottom:12px}.error{background:#fff5f5;color:#c53030}.success{background:#f0fff4;color:#276749}.order{border:1px solid #e2e8f0;border-radius:10px;padding:15px;margin-bottom:12px}.order-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.wrap{padding:12px}.actions .btn,.actions select{flex:1;min-width:120px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card" style="max-width:500px;margin:60px auto">
    <h1>Admin TokoSehat</h1><p class="muted">Masuk menggunakan akun yang sudah diberi role <b>admin</b>.</p>
    <div id="loginMsg" class="msg hidden"></div>
    <form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" type="submit">Masuk</button></form>
  </div>
  <div id="dashboard" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><h1 style="margin-bottom:4px">Dashboard Admin</h1><div id="adminName" class="muted"></div></div><div class="actions"><a class="btn secondary" href="index.html">Website</a><button class="btn secondary" type="button" onclick="refreshDashboard()">↻ Refresh</button><button class="btn danger" onclick="logout()">Keluar</button></div></div>
    <div id="msg" class="msg hidden"></div>
    <div class="grid"><div class="stat">Produk Aktif<b id="statProducts">0</b></div><div class="stat">Pesanan<b id="statOrders">0</b></div><div class="stat">Menunggu Verifikasi<b id="statPayments">0</b></div></div>
    <div class="card"><h2>Tambah Produk</h2><form id="productForm"><div class="row"><div class="field"><label>Nama</label><input id="pNama" required></div><div class="field"><label>Kategori</label><select id="pKategori"></select></div></div><div class="row"><div class="field"><label>Harga</label><input id="pHarga" type="number" min="0" required></div><div class="field"><label>Stok</label><input id="pStok" type="number" min="0" required></div></div><div class="field"><label>Deskripsi</label><textarea id="pDesc" required></textarea></div><div class="field"><label>Deskripsi Lengkap</label><textarea id="pFull"></textarea></div><div class="row"><div class="field"><label>Manfaat</label><textarea id="pManfaat"></textarea></div><div class="field"><label>Cara Penggunaan</label><textarea id="pCara"></textarea></div></div><div class="field"><label>URL Gambar</label><input id="pGambar" type="url"></div><button class="btn primary">Simpan Produk</button></form></div>
    <div class="card"><h2>Produk & Stok</h2><div class="table-wrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="products"></tbody></table></div></div>
    <div class="card"><h2>Pesanan & Pembayaran</h2><div id="orders"></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const TOKOSEHAT_SUPABASE_URL="https://appxgwliqdmnqorsdywh.supabase.co";
const TOKOSEHAT_SUPABASE_ANON_KEY="sb_publishable_ykh45BuWu3hgnzANq5cgiQ_AJkOGIUa";
const db=window.supabase.createClient(TOKOSEHAT_SUPABASE_URL,TOKOSEHAT_SUPABASE_ANON_KEY);

const CATS=[
 ['kosmetik','KOSMETIK'],['kesehatan','KESEHATAN'],['pertanian','PERTANIAN'],
 ['homecare','HOME CARE'],['perikanan','PERIKANAN'],['teknologi','INOVASI TEKNOLOGI'],
 ['peternakan','PETERNAKAN'],['lainlain','LAIN-LAIN']
];
const STATUS_LABEL={
 pending_payment:'Menunggu Pembayaran',
 payment_submitted:'Menunggu Verifikasi',
 processing:'Diproses',
 shipped:'Dikirim',
 completed:'Selesai',
 cancelled:'Dibatalkan'
};

function msg(t,err=false){
 const e=document.getElementById('msg');
 e.textContent=t;
 e.className='msg '+(err?'error':'success');
 e.classList.remove('hidden');
 clearTimeout(window.__msgTimer);
 window.__msgTimer=setTimeout(()=>e.classList.add('hidden'),5000);
}
function loginMsg(t){
 const e=document.getElementById('loginMsg');
 e.textContent=t;
 e.className='msg error';
 e.classList.remove('hidden');
}
function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shortId(id){return String(id||'').slice(0,8).toUpperCase()}

async function ensureAdmin(){
 const {data:{user},error:authError}=await db.auth.getUser();
 if(authError) throw authError;
 if(!user) return false;
 const {data,error}=await db.from('profiles').select('id,nama,email,username,role').eq('id',user.id).single();
 if(error) throw new Error('Profil admin tidak dapat dibaca: '+error.message);
 if(data.role!=='admin') return false;
 document.getElementById('adminName').textContent=`Login sebagai ${data.nama||data.email||user.email}`;
 return true;
}

async function loadProducts(){
 const {data,error}=await db.from('products').select('*').order('id');
 if(error) throw error;
 document.getElementById('statProducts').textContent=(data||[]).filter(p=>p.active===true).length;
 const tbody=document.getElementById('products');
 tbody.innerHTML=(data||[]).map(p=>{
   const active=p.active===true;
   const image=p.gambar?`<img class="thumb" src="${esc(p.gambar)}" onerror="this.style.display='none'">`:'';
   return `<tr>
    <td>${image}<div><b>${esc(p.nama)}</b><div class="muted">#${esc(p.id)} · ${esc(p.kategori||'-')}</div></div></td>
    <td><input id="price-${p.id}" type="number" min="0" value="${Number(p.harga||0)}" style="width:120px"></td>
    <td><input id="stock-${p.id}" type="number" min="0" value="${Number(p.stok||0)}" style="width:90px"></td>
    <td><select id="active-${p.id}">
      <option value="true" ${active?'selected':''}>Aktif</option>
      <option value="false" ${!active?'selected':''}>Nonaktif</option>
    </select></td>
    <td><div class="actions">
      <button class="btn primary btn-sm" onclick="saveProduct(${p.id})">Simpan</button>
      <button class="btn danger btn-sm" onclick="removeProduct(${p.id})">${active?'Nonaktifkan':'Hapus'}</button>
    </div></td>
   </tr>`;
 }).join('') || '<tr><td colspan="5" class="muted">Belum ada produk.</td></tr>';
}

async function saveProduct(id){
 try{
   const harga=Number(document.getElementById('price-'+id).value);
   const stok=Number(document.getElementById('stock-'+id).value);
   const active=document.getElementById('active-'+id).value==='true';
   if(!Number.isFinite(harga)||harga<0||!Number.isFinite(stok)||stok<0) throw new Error('Harga dan stok harus berupa angka yang valid.');
   const {error}=await db.from('products').update({
     harga,stok,active,status:active?'tersedia':'nonaktif',updated_at:new Date().toISOString()
   }).eq('id',id);
   if(error) throw error;
   msg('Produk berhasil diperbarui.');
   await loadProducts();
 }catch(e){msg(e.message||String(e),true)}
}

async function removeProduct(id){
 try{
   const {data:p,error:readError}=await db.from('products').select('id,nama,active').eq('id',id).single();
   if(readError) throw readError;
   if(p.active===true){
     if(!confirm(`Nonaktifkan produk "${p.nama}"? Produk akan hilang dari katalog pelanggan tetapi data tetap aman.`)) return;
     const {error}=await db.from('products').update({active:false,status:'nonaktif',updated_at:new Date().toISOString()}).eq('id',id);
     if(error) throw error;
     msg('Produk dinonaktifkan dan langsung hilang dari katalog pelanggan.');
   }else{
     if(!confirm(`Hapus permanen produk "${p.nama}"? Jika sudah pernah masuk pesanan, database mungkin menolak penghapusan.`)) return;
     const {error}=await db.from('products').delete().eq('id',id);
     if(error) throw error;
     msg('Produk berhasil dihapus.');
   }
   await loadProducts();
 }catch(e){msg('Gagal mengubah produk: '+(e.message||String(e)),true)}
}

async function addProduct(e){
 e.preventDefault();
 const button=e.submitter; if(button){button.disabled=true;button.textContent='Menyimpan...'}
 try{
   const {data:ids,error:maxError}=await db.from('products').select('id').order('id',{ascending:false}).limit(1);
   if(maxError) throw maxError;
   const id=(ids?.[0]?.id||0)+1;
   const row={
    id,
    nama:document.getElementById('pNama').value.trim(),
    kategori:document.getElementById('pKategori').value,
    harga:Number(document.getElementById('pHarga').value),
    stok:Number(document.getElementById('pStok').value),
    deskripsi:document.getElementById('pDesc').value.trim(),
    deskripsi_lengkap:document.getElementById('pFull').value.trim(),
    manfaat:document.getElementById('pManfaat').value.trim(),
    cara_pakai:document.getElementById('pCara').value.trim(),
    gambar:document.getElementById('pGambar').value.trim(),
    jumlah_terjual:0,status:'tersedia',active:true
   };
   if(!row.nama) throw new Error('Nama produk wajib diisi.');
   if(!Number.isFinite(row.harga)||row.harga<0) throw new Error('Harga tidak valid.');
   if(!Number.isFinite(row.stok)||row.stok<0) throw new Error('Stok tidak valid.');
   const {error}=await db.from('products').insert(row);
   if(error) throw error;
   e.target.reset();
   msg('Produk berhasil ditambahkan. Produk langsung tampil di katalog pelanggan.');
   await loadProducts();
 }catch(x){msg(x.message||String(x),true)}
 finally{if(button){button.disabled=false;button.textContent='Simpan Produk'}}
}

async function loadOrders(){
 const {data:orders,error}=await db.from('orders').select('*, order_items(*), payments(*)').order('created_at',{ascending:false});
 if(error) throw error;
 document.getElementById('statOrders').textContent=(orders||[]).length;
 document.getElementById('statPayments').textContent=(orders||[]).filter(o=>(o.payments||[]).some(p=>p.status==='submitted')).length;

 document.getElementById('orders').innerHTML=(orders||[]).map(o=>{
   const payments=(o.payments||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
   const pay=payments[0];
   const items=(o.order_items||[]).map(i=>`${esc(i.product_name)} × ${esc(i.quantity)}`).join(', ')||'-';
   return `<div class="order">
    <div class="order-head">
      <div><b>Pesanan #${esc(shortId(o.id))}</b><div class="muted">${new Date(o.created_at).toLocaleString('id-ID')}</div></div>
      <b>${esc(STATUS_LABEL[o.status]||o.status||'-')}</b>
    </div>
    <p><b>Barang:</b> ${items}</p>
    <p><b>Total: ${money(o.total)}</b><br>
      ${esc(o.customer_name||'-')} · ${esc(o.whatsapp||'-')}<br>${esc(o.address||'-')}
      ${o.note?`<br><span class="muted">Catatan: ${esc(o.note)}</span>`:''}
    </p>
    <div class="actions">
      <select id="status-${esc(o.id)}">
       ${Object.entries(STATUS_LABEL).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn primary btn-sm" onclick="setStatus('${esc(o.id)}')">Ubah Status</button>
      ${pay
        ? `<span class="muted">Pembayaran: ${esc(pay.status||'-')}</span>
           ${pay.status==='submitted'
             ? `<button class="btn secondary btn-sm" onclick="verifyPayment('${esc(pay.id)}','verified')">Verifikasi Bayar</button>
                <button class="btn danger btn-sm" onclick="verifyPayment('${esc(pay.id)}','rejected')">Tolak Bayar</button>`
             : ''}`
        : '<span class="muted">Belum ada konfirmasi pembayaran</span>'}
    </div>
   </div>`;
 }).join('') || '<p class="muted">Belum ada pesanan.</p>';
}

async function setStatus(id){
 try{
   const status=document.getElementById('status-'+id).value;
   const {error}=await db.rpc('admin_set_order_status',{p_order_id:id,p_status:status});
   if(error) throw error;
   msg('Status pesanan diperbarui.');
   await loadOrders();
 }catch(e){msg(e.message||String(e),true)}
}

async function verifyPayment(id,status){
 try{
   const {error}=await db.rpc('admin_verify_payment',{p_payment_id:id,p_status:status});
   if(error) throw error;
   msg(status==='verified'?'Pembayaran diverifikasi.':'Pembayaran ditolak.');
   await loadOrders();
 }catch(e){msg(e.message||String(e),true)}
}

async function refreshDashboard(){
 try{
   const ok=await ensureAdmin();
   if(!ok){await db.auth.signOut();location.reload();return}
   await Promise.all([loadProducts(),loadOrders()]);
   msg('Dashboard berhasil disinkronkan dengan Supabase.');
 }catch(e){msg('Gagal refresh: '+(e.message||String(e)),true)}
}

async function logout(){await db.auth.signOut();location.reload()}

document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 document.getElementById('loginMsg').classList.add('hidden');
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 try{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error) throw error;
   if(!await ensureAdmin()){
     await db.auth.signOut();
     throw new Error('Akun berhasil login tetapi role profiles bukan admin.');
   }
   document.getElementById('login').classList.add('hidden');
   document.getElementById('dashboard').classList.remove('hidden');
   await Promise.all([loadProducts(),loadOrders()]);
 }catch(e){
   loginMsg(e.message||String(e));
 }
});

document.getElementById('productForm').addEventListener('submit',addProduct);
const kategoriEl=document.getElementById('pKategori');
CATS.forEach(c=>kategoriEl.insertAdjacentHTML('beforeend',`<option value="${c[0]}">${c[1]}</option>`));

(async()=>{
 try{
   const {data:{session}}=await db.auth.getSession();
   if(session && await ensureAdmin()){
     document.getElementById('login').classList.add('hidden');
     document.getElementById('dashboard').classList.remove('hidden');
     await Promise.all([loadProducts(),loadOrders()]);
   }
 }catch(e){
   console.error('Init admin:',e);
   loginMsg('Gagal memeriksa akun admin: '+(e.message||String(e)));
 }
})();

db.auth.onAuthStateChange((event)=>{
 if(event==='SIGNED_OUT'){
   document.getElementById('dashboard').classList.add('hidden');
   document.getElementById('login').classList.remove('hidden');
 }
});
</script>

</body></html>
